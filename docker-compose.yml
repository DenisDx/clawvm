services:
  clawvm:
    build:
      context: .
      dockerfile: Dockerfile
    image: clawvm:latest
    container_name: clawvm
    restart: unless-stopped
    init: true
    read_only: true
    shm_size: ${PLAYWRIGHT_SHM_SIZE:-1gb}
    env_file:
      - .env
    environment:
      HOME: /home/clawvm
      OPENCLAW_HOME: /home/clawvm/.openclaw
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      CLAWVM_HTTPS_HOST: ${CLAWVM_HTTPS_HOST:-127.0.0.1}
      CLAWVM_HTTPS_PORT: ${CLAWVM_HTTPS_PORT:-8880}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ./data
        target: /home/clawvm
        read_only: false
      - type: bind
        source: ./.env
        target: /home/clawvm/.env
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    ports:
      - "${CLAWVM_HTTPS_BIND_HOST:-127.0.0.1}:${CLAWVM_HTTPS_HOST_PORT:-8880}:${CLAWVM_HTTPS_PORT:-8880}"